<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F8FAFC;
    }

    /* Main Slide Stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .slide-wrapper {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transition: opacity 0.2s ease-in-out;
    }

    /* Floating Header HUD */
    .hud-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0) 100%);
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #E2E8F0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .hud-badge {
      background: #2C5E8A;
      color: #fff;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      font-weight: 600;
    }

    .hud-tools {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #F8FAFC;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .hud-btn.active {
      background: #E88D67;
      border-color: #E88D67;
      color: #fff;
    }

    .page-counter {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #CBD5E1;
      padding: 0 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Left / Right Click Nav Zones */
    .click-zone {
      position: absolute;
      top: 15%;
      bottom: 15%;
      width: 15%;
      z-index: 30;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .click-zone.left {
      left: 0;
    }

    .click-zone.right {
      right: 0;
    }

    .click-zone:hover {
      opacity: 1;
    }

    .nav-arrow-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.8rem;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* Bottom Progress Bar */
    .hud-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2C5E8A, #E88D67);
      width: 7.14%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(232, 141, 103, 0.8);
    }

    /* Speaker Notes Drawer */
    .notes-drawer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: min(880px, 92vw);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(232, 141, 103, 0.4);
      border-radius: 16px;
      padding: 1.2rem 1.6rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      z-index: 60;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .notes-drawer.open {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 0.4rem;
    }

    .notes-tag {
      color: #E88D67;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .notes-body {
      font-size: 1.05rem;
      line-height: 1.65;
      color: #E2E8F0;
    }

    .notes-body strong {
      color: #FED7AA;
    }

    /* Auto-hide HUD on idle */
    .autohide {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Shortcut Toast */
    .toast {
      position: absolute;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 94, 138, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.4s ease;
      opacity: 0;
    }

    .toast.show {
      opacity: 1;
    }
  
    /* Floating External Links Bar for Reading Resources */
    .floating-resource-bar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: none;
      gap: 1rem;
      background: rgba(15, 23, 42, 0.88);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .floating-res-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #FFF;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      transition: all 0.2s ease;
    }
    .floating-res-link.mdn {
      background: #E88D67;
    }
    .floating-res-link.mdn:hover {
      background: #D67247;
      transform: scale(1.05);
    }
    .floating-res-link.hami {
      background: #2C5E8A;
    }
    .floating-res-link.hami:hover {
      background: #1E4263;
      transform: scale(1.05);
    }

  </style>
</head>

    <div class="click-zone left" id="zone-prev" title="上一頁 (← / PageUp)">

    </div>
    <div class="click-zone right" id="zone-next" title="下一頁 (→ / Space / Enter)">
      <div class="nav-arrow-pill">›</div>
    </div>

    <!-- Bottom Progress Track -->
    <footer class="hud-footer" id="hud-footer">
      <div class="progress-track" id="progress-track">

      </div>
    </footer>

      </div>
      <div class="notes-body" id="notes-body">

      </div>
    </div>

    <!-- Quick Toast Notification -->
    <div class="toast" id="toast">按 ← → 鍵切換，按 F 進入全螢幕</div>
  </div>

    let currentIdx = 0;
    let isNotesOpen = false;
    let idleTimer = null;

    const slideImg = document.getElementById("slide-img");
    const pageCounter = document.getElementById("page-counter");
    const progressFill = document.getElementById("progress-fill");
    const notesDrawer = document.getElementById("notes-drawer");
    const notesTag = document.getElementById("notes-tag");
    const notesBody = document.getElementById("notes-body");
    const btnNotes = document.getElementById("btn-notes");
    const btnFs = document.getElementById("btn-fullscreen");
    const fsIcon = document.getElementById("fs-icon");
    const fsText = document.getElementById("fs-text");
    const hudHeader = document.getElementById("hud-header");
    const hudFooter = document.getElementById("hud-footer");
    const zonePrev = document.getElementById("zone-prev");
    const zoneNext = document.getElementById("zone-next");
    const toast = document.getElementById("toast");

    function renderSlide(idx) {
      // Toggle resource bar on Slide 08 (index 7)
      const resBar = document.getElementById("quick-resource-bar");
      if (resBar) {
        resBar.style.display = (idx === 7) ? "flex" : "none";
      }

      if (idx < 0) idx = 0;
      if (idx >= slidesData.length) idx = slidesData.length - 1;
      currentIdx = idx;

      slideImg.style.opacity = "0.7";
      setTimeout(() => {
        slideImg.src = slidesData[currentIdx].src;
        slideImg.style.opacity = "1";
      }, 100);

      const numStr = String(currentIdx + 1).padStart(2, "0");
      pageCounter.textContent = `${numStr} / ${String(slidesData.length).padStart(2, "0")}`;
      const pct = ((currentIdx + 1) / slidesData.length) * 100;
      progressFill.style.width = `${pct}%`;

      notesTag.textContent = slidesData[currentIdx].title;
      notesBody.innerHTML = slidesData[currentIdx].notes;
    }

    function prevSlide() {
      if (currentIdx > 0) renderSlide(currentIdx - 1);
    }

    function nextSlide() {
      if (currentIdx < slidesData.length - 1) renderSlide(currentIdx + 1);
    }

    function toggleNotes() {
      isNotesOpen = !isNotesOpen;
      notesDrawer.classList.toggle("open", isNotesOpen);
      btnNotes.classList.toggle("active", isNotesOpen);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request error:", err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        fsIcon.textContent = "🗗";
        fsText.textContent = "視窗化 (F)";
      } else {
        fsIcon.textContent = "⛶";
        fsText.textContent = "全螢幕 (F)";
      }
    });

    // Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      resetIdleTimer();
      switch (e.key) {
        case "ArrowRight":
        case "PageDown":
        case " ":
        case "Enter":
          e.preventDefault();
          nextSlide();
          break;
        case "ArrowLeft":
        case "PageUp":
        case "Backspace":
          e.preventDefault();
          prevSlide();
          break;
        case "f":
        case "F":
          e.preventDefault();
          toggleFullscreen();
          break;
        case "n":
        case "N":
          e.preventDefault();
          toggleNotes();
          break;
        case "Home":
          e.preventDefault();
          renderSlide(0);
          break;
        case "End":
          e.preventDefault();
          renderSlide(slidesData.length - 1);
          break;
      }
    });

    // Click Zones
    zonePrev.addEventListener("click", () => {
      prevSlide();
      resetIdleTimer();
    });

    zoneNext.addEventListener("click", () => {
      nextSlide();
      resetIdleTimer();
    });

    btnNotes.addEventListener("click", toggleNotes);
    btnFs.addEventListener("click", toggleFullscreen);

    // Click progress bar to jump
    document.getElementById("progress-track").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      const targetIdx = Math.floor(clickRatio * slidesData.length);
      renderSlide(targetIdx);
    });

    // Idle HUD fade
    function resetIdleTimer() {
      hudHeader.classList.remove("autohide");
      hudFooter.classList.remove("autohide");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!isNotesOpen) {
          hudHeader.classList.add("autohide");
          hudFooter.classList.add("autohide");
        }
      }, 3500);
    }

    document.addEventListener("mousemove", resetIdleTimer);

    // Touch Swipe Support
    let touchStartX = 0;
    document.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diffX = touchEndX - touchStartX;
      if (Math.abs(diffX) > 50) {
        if (diffX < 0) nextSlide();
        else prevSlide();
      }
    }, false);

    // Initial load
    renderSlide(0);
    resetIdleTimer();

    // Show quick toast on startup
    setTimeout(() => {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 4000);
    }, 800);
  </script>
